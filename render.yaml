# Free temporary preview. The web service sleeps when idle; Postgres expires after 30 days.
services:
  - type: web
    name: somnath-chess-preview
    runtime: docker
    region: singapore
    plan: free
    numInstances: 1
    dockerfilePath: ./deploy/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: somnath-chess-preview-db
          property: connectionString
      - key: COOKIE_SECURE
        value: 'true'
      - key: PORT
        value: '10000'

databases:
  - name: somnath-chess-preview-db
    region: singapore
    plan: free
    postgresMajorVersion: '17'
    ipAllowList: []
